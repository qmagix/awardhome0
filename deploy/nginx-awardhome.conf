# Reverse proxy for AwardHome. TLS terminates at Cloudflare (recommended:
# proxied DNS record + SSL mode "Full (strict)" with a Cloudflare origin
# certificate installed here — see docs/deployment.md). If you skip
# Cloudflare, use certbot to add a Let's Encrypt cert to this server block.
server {
    listen 80;
    listen [::]:80;
    server_name awardhome.com www.awardhome.com;   # adjust to your domain

    client_max_body_size 20m;   # CSV/logo uploads

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
